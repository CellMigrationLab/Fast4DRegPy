name: cleanup full-movie check

on:
  push:
    branches: [cleanup-maintainability-docs]
    paths:
      - ".github/workflows/cleanup-full-movie-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[validation]"
      - name: Cache the verified Zenodo archive
        uses: actions/cache@v4
        with:
          path: .validation-data/2-Synthetic-drift-dataset.zip
          key: zenodo-7514913-2-Synthetic-drift-dataset-27e3623f58d23d7c50674edc9432fe1b
      - name: Run strict full-movie validation
        run: >
          python validation/full_movie/validate_large_drift.py
          --download --gate strict --workers 4
      - name: Print summary
        if: always()
        run: |
          cat validation-results/large-drift-full-movie/summary.json || true
          cat validation-results/large-drift-full-movie/run_info.json || true
