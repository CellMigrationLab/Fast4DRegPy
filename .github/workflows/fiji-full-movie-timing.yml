name: fiji full-movie timing

# Runs the original Fast4DReg Fiji macro (v2.1, headless under Xvfb) and
# Fast4DRegPy on the complete published synthetic movie on the same runner,
# records runtime and memory for both, and compares Fiji's drift tables and
# corrected stack with Fast4DRegPy and the archived Fiji result. Manual only.
on:
  workflow_dispatch:

jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[validation]"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: java -version && javac -version && nproc && free -g
      - name: Fetch the Fast4DReg Fiji sources (commit 0483ace)
        run: |
          git clone https://github.com/CellMigrationLab/Fast4DReg ../Fast4DReg
          git -C ../Fast4DReg checkout 0483ace1ac5b8ee0e3938d00c303104109897803
      - run: validation/fiji/setup_imagej.sh "$RUNNER_TEMP/ImageJ" ../Fast4DReg
      - name: Cache the verified Zenodo archive
        uses: actions/cache@v4
        with:
          path: .validation-data/2-Synthetic-drift-dataset.zip
          key: zenodo-7514913-2-Synthetic-drift-dataset-27e3623f58d23d7c50674edc9432fe1b
      - name: Time Fiji and Fast4DRegPy
        env:
          FIJI_XMX: 12g
        run: >
          python validation/fiji/time_full_movie.py "$RUNNER_TEMP/ImageJ"
          "../Fast4DReg/Fast4DReg/macros/time_estimate+apply.ijm"
          --download --workers 4
      - if: always()
        run: cat validation-results/fiji-timing/timing_and_parity.json validation-results/fiji-timing/fiji_log.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiji-full-movie-timing
          path: |
            validation-results/fiji-timing/*.json
            validation-results/fiji-timing/*.txt
