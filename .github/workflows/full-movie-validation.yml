name: full-movie validation

# Downloads the published Fast4DReg synthetic dataset (Zenodo record 7514913),
# verifies its checksum, registers the complete 25-frame, 69-plane movie and
# compares it with the archived Fiji output and the synthetic ground truth.
# Manual only: it downloads several GB and runs for tens of minutes.
on:
  workflow_dispatch:
    inputs:
      gate:
        description: "Threshold preset (baseline or strict)"
        default: strict
        type: choice
        options: [strict, baseline]
      workers:
        description: "Transform worker threads for the parallel run"
        default: "4"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[validation]"
      - name: Cache the verified Zenodo archive
        uses: actions/cache@v4
        with:
          path: .validation-data/2-Synthetic-drift-dataset.zip
          key: zenodo-7514913-2-Synthetic-drift-dataset-27e3623f58d23d7c50674edc9432fe1b
      - name: Run full-movie validation
        run: >
          python validation/full_movie/validate_large_drift.py
          --download --gate ${{ inputs.gate || 'strict' }}
          --workers ${{ inputs.workers || '4' }}
      - name: Print machine-readable results
        if: always()
        run: |
          for f in validation-results/*/summary.json validation-results/*/run_info.json \
                   validation-results/*/shifts_per_frame.csv \
                   validation-results/*/fiji_comparison_metrics.csv; do
            echo "===== $f"; cat "$f" || true
          done
          # Artifact storage is not reachable from every environment that
          # reviews these results; also print the figures.
          for f in validation-results/*/*.png; do
            echo "===== BASE64 $f"; base64 -w 0 "$f"; echo
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-movie-validation-results
          path: validation-results/
