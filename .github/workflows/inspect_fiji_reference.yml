name: inspect-fiji-reference-tiff

on:
  push:
    branches: [zenodo-xyzt-fixture]
    paths:
      - ".github/workflows/inspect_fiji_reference.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: zenodo-xyzt-fixture
      - run: python -m pip install --quiet remotezip tifffile
      - name: Inspect archived Fast4DReg reference TIFF
        run: |
          python - <<'PY'
          from remotezip import RemoteZip
          from pathlib import Path
          import json, shutil, tifffile

          url = "https://zenodo.org/records/7514913/files/2-Synthetic-drift-dataset.zip?download=1"
          member = "2-Synthetic-drift-dataset/2.2-Synthetic-drift-expected-results/2.2.1-LargeDrift_F4DReg.tif"
          out = Path("/tmp/fiji.tif")
          with RemoteZip(url) as z:
              with z.open(member) as src, out.open("wb") as dst:
                  shutil.copyfileobj(src, dst, length=8*1024*1024)
          with tifffile.TiffFile(out) as tif:
              s = tif.series[0]
              info = {
                  "member": member,
                  "axes": s.axes,
                  "shape": list(s.shape),
                  "dtype": str(s.dtype),
                  "is_imagej": bool(tif.is_imagej),
                  "imagej_metadata": tif.imagej_metadata,
              }
          Path("docs/fiji_reference_tiff_metadata.json").write_text(
              json.dumps(info, indent=2, default=str) + "\n", encoding="utf-8"
          )
          print(json.dumps(info, indent=2, default=str))
          PY
      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fiji_reference_tiff_metadata.json
          git commit -m "Inspect archived Fiji reference TIFF"
          git push
