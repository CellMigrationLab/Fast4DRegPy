name: inspect-zenodo-synthetic

on:
  push:
    branches: [zenodo-fixture-inspect]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet remotezip requests
      - name: List synthetic archive
        run: |
          python - <<'PY'
          from remotezip import RemoteZip
          url = "https://zenodo.org/records/7514913/files/2-Synthetic-drift-dataset.zip?download=1"
          with RemoteZip(url) as archive:
              infos = sorted(archive.infolist(), key=lambda x: x.file_size)
              print("filename\tbytes\tcompressed")
              for info in infos:
                  print(f"{info.filename}\t{info.file_size}\t{info.compress_size}")
          PY
