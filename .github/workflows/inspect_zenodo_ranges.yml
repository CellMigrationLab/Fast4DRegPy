name: inspect-zenodo-zip-ranges

on:
  push:
    branches: [zenodo-xyzt-fixture]
    paths:
      - ".github/workflows/inspect_zenodo_ranges.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: zenodo-xyzt-fixture
      - name: Install remote ZIP reader
        run: python -m pip install --quiet remotezip
      - name: Read archive directory by HTTP ranges
        run: |
          python - <<'PY'
          from remotezip import RemoteZip
          from pathlib import Path

          url = "https://zenodo.org/records/7514913/files/2-Synthetic-drift-dataset.zip?download=1"
          with RemoteZip(url) as z:
              infos = z.infolist()

          lines = [
              "# Zenodo synthetic archive inventory",
              "",
              "Source: https://zenodo.org/records/7514913",
              "Archive: 2-Synthetic-drift-dataset.zip",
              "MD5: 27e3623f58d23d7c50674edc9432fe1b",
              "",
              "| Member | Uncompressed bytes | Compressed bytes |",
              "| --- | ---: | ---: |",
          ]
          for info in infos:
              lines.append(f"| \`{info.filename}\` | {info.file_size} | {info.compress_size} |")
          Path("docs/zenodo_synthetic_archive_inventory.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/zenodo_synthetic_archive_inventory.md
          git commit -m "Inventory Zenodo synthetic archive by range request" || exit 0
          git push
