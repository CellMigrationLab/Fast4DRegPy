name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # The tools for napari and Fiji (src/fast4dreg_lc_tools) need labconstrictor-tools, and pandas for their tables:
      # the version the app installer pins (LC_TOOLS_PIN in app/bash_bat_scripts/post_install.sh).
      - name: Install labconstrictor-tools as the app installer does
        run: |
          pin=$(sed -n 's/^ *LC_TOOLS_PIN="\(.*\)"$/\1/p' app/bash_bat_scripts/post_install.sh)
          echo "labconstrictor-tools $pin"
          python -m pip install pandas "https://github.com/CellMigrationLab/LabConstrictor-Tools/archive/refs/tags/${pin}.zip"
      - run: python -c "import nanopyx; print(nanopyx.__version__)"
      - run: python -m pytest -q
      - name: Tool cases (the cases the napari and Fiji checks use)
        working-directory: lc_tests
        run: |
          python make_fixtures.py fixtures
          labconstrictor-tools check --module fast4dreg_lc_tools
          labconstrictor-tools test --module fast4dreg_lc_tools --cases cases.json
      - if: matrix.python-version == '3.12'
        run: python -m ruff check src tests benchmarks validation

  distribution:
    # Build the sdist and wheel, install the wheel into a clean environment and
    # run the test suite shipped in the sdist against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Check wheel contents
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel, = pathlib.Path("dist").glob("*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          assert not [n for n in names if n.startswith(("tests/", "validation/"))], names
          assert not [n for n in names if n.endswith((".npz", ".tif", ".tiff"))], names
          print("\n".join(names))
          PY
      - name: Test the sdist against the installed wheel
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl pytest
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/fast4dregpy-* && rm -rf src
          /tmp/clean/bin/python -m pytest -q
