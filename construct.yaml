name: Fast4DRegPy
version: 0.5.0
environment_file: environment.yaml
installer_type: all
license_file: LICENSE
conclusion_text: Thank you! You have successfully installed Fast4DRegPy 0.5.0.
keep_pkgs: false
register_python: false
initialize_conda: false
extra_files:
- app/bash_bat_scripts/pre_uninstall.sh: pre_uninstall.sh
- app/bash_bat_scripts/uninstall.sh: uninstall.sh
- app/menuinst/Welcome.ipynb: Fast4DRegPy/notebooks/Welcome.ipynb
- app/menuinst/notebook_launcher.json: Fast4DRegPy/notebook_launcher.json
- app/python_scripts/hide_code_cells.py: Fast4DRegPy/hide_code_cells.py
- app/python_scripts/include_path.py: Fast4DRegPy/include_path.py
- app/python_scripts/launch_jupyter.py: Fast4DRegPy/launch_jupyter.py
- construct.yaml: Fast4DRegPy/construct.yaml
- notebooks/notebook_latest_versions.yaml: Fast4DRegPy/notebook_latest_versions.yaml
- requirements.txt: Fast4DRegPy/requirements.txt
- requirements_gpu.txt: Fast4DRegPy/requirements_gpu.txt
post_install: app/bash_bat_scripts/post_install.bat # [win]
post_install: app/bash_bat_scripts/post_install.sh # [unix]
pre_uninstall: app/bash_bat_scripts/pre_uninstall.bat # [win]
pre_uninstall: app/bash_bat_scripts/pre_uninstall.sh # [unix]
