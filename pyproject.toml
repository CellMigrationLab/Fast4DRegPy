[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast4dreg-python"
version = "0.4.0"
description = "Python implementation of Fast4DReg using NanoPyx for projection-based microscopy registration"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{ name = "CellMigrationLab" }]
keywords = ["microscopy", "image registration", "drift correction", "Fast4DReg", "NanoPyx"]
dependencies = [
  "nanopyx==2.1.4",
  "numpy>=2.0",
  "scipy>=1.8",
  "scikit-image>=0.19",
  "tifffile>=2022.5.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
notebook = ["jupyterlab>=4", "ipywidgets>=8", "matplotlib>=3.5"]
dev = ["fast4dreg-python[test,notebook]", "build>=1.2"]

[project.urls]
Repository = "https://github.com/CellMigrationLab/CellMigrationLab-Fast4DReg-Python"
Fast4DReg = "https://github.com/CellMigrationLab/Fast4DReg"
NanoPyx = "https://github.com/HenriquesLab/NanoPyx"
Paper = "https://doi.org/10.1242/jcs.260728"
Dataset = "https://zenodo.org/records/6534570"
"Dataset (latest version)" = "https://zenodo.org/records/7514913"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: exercises the installed NanoPyx implementation",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "RUF", "UP"]
